plugins {
    id 'com.android.application'
}

def releaseSigningConfigured = ['FILEFLOW_KEYSTORE_PATH', 'FILEFLOW_KEYSTORE_PASSWORD', 'FILEFLOW_KEY_ALIAS', 'FILEFLOW_KEY_PASSWORD']
        .every { System.getenv(it) }

android {
    namespace 'com.fileflow.app'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId 'com.fileflow.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(System.getenv('FILEFLOW_KEYSTORE_PATH'))
                storePassword System.getenv('FILEFLOW_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FILEFLOW_KEY_ALIAS')
                keyPassword System.getenv('FILEFLOW_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
