plugins {
    id 'com.android.application'
}

def releaseSigningConfigured = ['FILEFLOW_KEYSTORE_PATH', 'FILEFLOW_KEYSTORE_PASSWORD', 'FILEFLOW_KEY_ALIAS', 'FILEFLOW_KEY_PASSWORD']
        .every { System.getenv(it) }
def processingApiUrl = providers.gradleProperty('fileflowProcessingApiUrl').orElse(System.getenv('FILEFLOW_PROCESSING_API_URL') ?: '').get()
def bundledOfflineOcr = providers.gradleProperty('fileflowOfflineOcr').orElse('false').get().toBoolean()

android {
    namespace 'com.fileflow.app'
    compileSdk 36
    buildToolsVersion '36.1.0'

    defaultConfig {
        applicationId 'com.fileflow.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        buildConfigField 'String', 'PROCESSING_API_URL', '"' + processingApiUrl.replace('\\', '\\\\').replace('"', '\\"') + '"'
        buildConfigField 'boolean', 'BUNDLED_OFFLINE_OCR', bundledOfflineOcr.toString()
    }

    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(System.getenv('FILEFLOW_KEYSTORE_PATH'))
                storePassword System.getenv('FILEFLOW_KEYSTORE_PASSWORD')
                keyAlias System.getenv('FILEFLOW_KEY_ALIAS')
                keyPassword System.getenv('FILEFLOW_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningConfigured) signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            doFirst { rootProject.file('../.tools/android-test-home').mkdirs() }
            jvmArgs '--add-opens=java.base/java.lang=ALL-UNNAMED', '--add-opens=java.base/java.util=ALL-UNNAMED', '--add-opens=java.base/java.io=ALL-UNNAMED', '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED'
            systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            systemProperty 'user.home', rootProject.file('../.tools/android-test-home').absolutePath
            systemProperty 'fileflow.capture', System.getProperty('fileflow.capture','after')
            systemProperty 'fileflow.evidenceDir', providers.gradleProperty('fileflowEvidenceDir').orElse(rootProject.file('../.tools/android-ui').absolutePath).get()
        }
    }
    sourceSets.main.java.srcDirs += bundledOfflineOcr ? 'src/offlineOcr/java' : 'src/noOcr/java'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'com.tom-roush:pdfbox-android:2.0.27.0'
    // Bundled Latin recognition model: available without a runtime model download.
    if (bundledOfflineOcr) implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'com.google.android.ump:user-messaging-platform:4.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
